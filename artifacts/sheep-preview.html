<!doctype html><html><head><meta charset="utf-8"><style>/* 1. Shared design values. Start here to change the look of the whole site. */
:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--page);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --accent: #245bdb;
  --muted: #5e6879;
  --border: #dce1e9;
  --radius: 18px;
}

/* 2. Base styles and shared primitives. */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; }
body { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
h1, h2, h3, p { margin-top: 0; }
p { line-height: 1.75; }
.container { width: min(1080px, calc(100% - 64px)); margin-inline: auto; }
.eyebrow { font-size: .75rem; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 24px; padding: 14px 20px; border-radius: 8px; font-size: .875rem; font-weight: 600; transition: background .2s; }
.button-primary { background: var(--accent); color: var(--surface); }
.button-primary:hover { background: #1949b6; }
.text-link { font-size: .875rem; font-weight: 600; }
.text-link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; }
.text-link span { margin-left: 8px; }
.skip-link { position: fixed; left: 20px; top: -100px; padding: 14px; background: var(--surface); z-index: 10; border: 2px solid var(--accent); }
.skip-link:focus { top: 12px; }

/* 3. Header and responsive navigation. */
.site-header { position: sticky; top: 0; z-index: 5; background: var(--header); border-bottom: 1px solid var(--border); }
.navbar { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 1rem; font-weight: 700; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--surface); background: var(--accent); font-size: .7rem; }
.brand-dot { color: var(--accent); }
.nav-links { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: .85rem; }
.nav-links a:hover { color: var(--accent); }
.menu-toggle { display: none; }

/* 4. Intro and profile placeholder. */
.hero { display: grid; grid-template-columns: 1.55fr 1fr; gap: 70px; align-items: center; padding-block: 90px; }
.hero .eyebrow { color: var(--muted); font-size: .68rem; }
.status-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: var(--accent); }
h1 { font-size: clamp(2.7rem, 5vw, 4.2rem); line-height: 1.08; letter-spacing: -.055em; font-weight: 650; margin-bottom: 26px; }
.hero-introduction { color: var(--muted); max-width: 490px; font-size: 1rem; margin-bottom: 30px; }
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 24px; }
.profile-card { border: 1px solid var(--profileBorder); background: var(--profile); border-radius: var(--radius); padding: 26px; min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; overflow: hidden; }
.profile-caption { font-size: .65rem; color: var(--profileText); text-transform: uppercase; letter-spacing: .13em; }
.profile-avatar { width: 170px; height: 170px; background: var(--avatar); border: 1px solid var(--avatarBorder); border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-size: 3.8rem; font-weight: 650; letter-spacing: -.06em; position: relative; transform: rotate(-7deg); }
.avatar-spark { position: absolute; font-size: 3.8rem; right: -23px; top: -17px; color: #245bdb; }
.profile-card-footer { text-align: center; display: grid; gap: 6px; }
.profile-card-footer strong { font-size: 1rem; }
.profile-card-footer > span { font-size: .75rem; color: var(--profileText); }

/* 5. Sections and project cards. */
.section { border-top: 1px solid var(--border); padding-block: 52px 60px; }
.section-heading { margin-bottom: 28px; }
.section-number { color: var(--accent); font-size: .7rem; }
h2 { font-size: clamp(1.6rem, 3vw, 2rem); letter-spacing: -.035em; line-height: 1.25; font-weight: 600; margin-bottom: 0; }
h3 { font-size: 1.1rem; letter-spacing: -.02em; margin-bottom: 12px; }
.about-copy { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; color: var(--muted); }
.about-copy p { margin-bottom: 0; }
.project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.project-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.project-art { height: 210px; background: var(--art); color: var(--artText); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.project-card:nth-child(even) .project-art { background: var(--artAlt); color: var(--artAltText); }
.project-art-label { font-size: .65rem; letter-spacing: .12em; }
.project-symbol { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 3.8rem; text-align: center; letter-spacing: -.12em; }
.project-art-note { font-size: .7rem; align-self: flex-end; }
.project-content { padding: 26px; }
.card-category { color: var(--muted); font-size: .67rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.project-content > p:not(.card-category) { color: var(--muted); font-size: .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 22px 0 0; }
.tags li { background: var(--tag); border-radius: 5px; color: var(--tagText); padding: 5px 10px; font-size: .7rem; }
.project-links { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 22px; }

/* 6. Skills, contact, footer. */
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.skill-card { border-left: 2px solid #b7c9ef; padding-left: 20px; }
.skill-card h3 { font-size: .95rem; }
.skill-card p { font-size: .875rem; color: var(--muted); margin-bottom: 0; }
.contact-panel { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 30px; }
.contact-panel p { color: var(--muted); }
.contact-links { display: flex; align-items: center; flex-wrap: wrap; gap: 24px; }
.placeholder-label { font-size: .8rem; color: var(--muted); }
.site-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding-block: 26px; border-top: 1px solid var(--border); }
.site-footer p, .site-footer a { margin: 0; font-size: .75rem; color: var(--muted); }

/* 7. Smaller screens and reduced-motion preferences. */
@media (max-width: 800px) {
  .hero { gap: 32px; padding-block: 58px; }
  .profile-card { padding: 20px; min-height: 310px; }
  .profile-avatar { width: 135px; height: 135px; font-size: 3rem; }
  .hero-actions { gap: 18px; }
  .skills-grid { gap: 18px; }
}
@media (max-width: 620px) {
  .container { width: calc(100% - 40px); }
  .navbar { min-height: 74px; flex-wrap: wrap; gap: 0; }
  .menu-toggle { display: block; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; background: var(--surface); font-size: .8rem; color: inherit; }
  .nav-links { display: none; width: 100%; flex-direction: column; gap: 0; padding-bottom: 16px; }
  .nav-links.is-open { display: flex; }
  .nav-links a { display: block; padding: 12px 0; }
  .hero { grid-template-columns: 1fr; gap: 36px; padding-block: 48px; }
  .hero h1 { max-width: 440px; }
  .profile-card { min-height: 310px; }
  .section { padding-block: 38px 44px; }
  .about-copy, .project-grid, .skills-grid { grid-template-columns: 1fr; gap: 24px; }
  .contact-panel { padding: 24px; }
  .site-footer { align-items: flex-start; flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}

:root { color-scheme: light;--header: #f7f8faf5;--artText: #63748f;--profileBorder: #d0dcf3;--art: #e8edf4;--artAlt: #e7eee9;--page: #f7f8fa;--text: #182337;--tag: #f1f3f7;--profileText: #465979;--tagText: #4a586c;--avatarBorder: #b9cdf6;--profile: #eaf0fd;--artAltText: #456557;--avatar: #d6e2ff;--surface: white; }

 .navbar { column-gap: 8px; }

/* Cozy village: felt scenery, parchment, and forest greens. */
:root {
  --page: #f4f0df; --surface: #fffae9; --text: #303e2e; --muted: #626c53;
  --accent: #426943; --border: #d3cfaf; --header: #f4f0dff2;
  --art: #dce5bd; --artText: #456140; --artAlt: #e7d9b7; --artAltText: #6f6042;
  --tag: #e8ecd3; --tagText: #536142; --radius: 22px;
  --sky-top: #b8d6c1; --sky-bottom: #e7e9bc; --celestial: #f8e7a2;
  --hill-far: #a4bc88; --hill-mid: #82a469; --hill-near: #698b50; --hill-front: #577b47;
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
}
:root[data-theme="dark"] {
  --page: #17271f; --surface: #22352a; --text: #eee9d1; --muted: #b6c0a3;

  --art: #304b36; --artText: #cfddb1; --artAlt: #494535; --artAltText: #e2d2aa;
  --tag: #344734; --tagText: #d2ddbd;
  --sky-top: #213c4b; --sky-bottom: #647c73; --celestial: #f6efd1;
  --hill-far: #54755d; --hill-mid: #40664e; --hill-near: #33563e; --hill-front: #294a34;
}
body { background-image: radial-gradient(#9d987f18 .7px, transparent .7px); background-size: 5px 5px; }
h1, h2, h3, .brand { font-family: Georgia, 'Times New Roman', serif; }

.site-header { border-bottom: 1px dashed var(--border); backdrop-filter: blur(12px); }
.navbar { min-height: 84px; gap: 22px; }
.brand { font-size: 1.15rem; }
.brand-mark { background: var(--accent); color: var(--page); border-radius: 12px 12px 7px 7px; outline: 1px dashed var(--page); outline-offset: -4px; width: 38px; height: 42px; }

.hero { grid-template-columns: 1fr 1.12fr; gap: 42px; padding-block: 78px 64px; }

.button { border-radius: 12px; box-shadow: 0 3px 0 #243f2926; }

.village-scene { position: relative; padding: 10px 10px 44px; background: var(--surface); border: 1px solid var(--border); border-radius: 46% 46% 20px 20px; box-shadow: 0 15px 45px #253f2410, inset 0 0 0 5px var(--page); transform: rotate(1deg); }

/* The village wayfinder and full quest journal. */
.adventure-header { background: transparent; border: 0; padding-top: 14px; backdrop-filter: none; }
.adventure-header .navbar { min-height: 78px; padding: 10px 18px; border: 1px solid var(--border); border-radius: 23px; background: var(--header); box-shadow: 0 5px 0 #34472d0c, 0 12px 32px #192e2010; backdrop-filter: blur(16px); gap: 18px; }
.brand-copy { display: grid; gap: 5px; white-space: nowrap; }
.brand-copy small { font-family: 'Trebuchet MS', sans-serif; color: var(--muted); font-size: .5rem; letter-spacing: .17em; font-weight: 400; }
.adventure-header .nav-links { margin-left: auto; gap: 4px; align-items: center; }
.adventure-header .nav-links a { position: relative; display: flex; align-items: center; gap: 7px; padding: 12px 10px; border: 1px solid transparent; border-radius: 12px; transition: transform .2s, background .2s, border-color .2s; font-size: .78rem; }
.adventure-header .nav-links a:hover, .adventure-header .nav-links a:focus-visible { background: var(--tag); transform: translateY(-3px); border-color: var(--border); color: var(--text); }
.adventure-header .nav-links a.is-active { background: var(--accent); color: var(--page); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent); }
.nav-icon { font-size: 1.1rem; line-height: 1; transition: transform .2s; }
.nav-links a:hover .nav-icon { transform: rotate(-12deg); }
.nav-gem { position: absolute; bottom: -8px; left: calc(50% - 3px); font-size: 7px; color: var(--accent); opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; }
.nav-links a.is-active .nav-gem { opacity: 1; transform: translateY(0); }
.theme-switch { flex-shrink: 0; display: flex; align-items: center; gap: 7px; border: 1px dashed var(--border); background: var(--surface); color: var(--text); padding: 10px 12px; border-radius: 50px; font-size: .7rem; transition: transform .2s, box-shadow .2s; }
.theme-switch > span:first-child { font-size: 1.2rem; line-height: 1; }
.theme-switch:hover { transform: rotate(5deg); box-shadow: 0 3px 0 var(--border); }
.all-projects-link { margin-top: 28px; }
.projects-page { padding-block: 42px 80px; min-height: 75vh; }
.village-return { color: var(--muted); display: inline-block; margin-bottom: 40px; }
.journal-heading { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 32px; }
.journal-heading h1 { margin-bottom: 18px; }
.journal-heading .eyebrow { color: var(--accent); font-size: .68rem; }
.journal-heading p:last-child { color: var(--muted); max-width: 550px; margin-bottom: 0; }
.journal-seal { width: 126px; height: 126px; flex-shrink: 0; border: 1px dashed var(--accent); outline: 1px solid var(--border); outline-offset: 6px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--accent); font-size: .6rem; letter-spacing: .12em; line-height: 1.7; transform: rotate(9deg); text-align: center; }
.journal-seal span { font-size: 2.3rem; line-height: 1.2; }
.journal-tools { border: 1px solid var(--border); background: var(--surface); border-radius: 18px; padding: 24px; }
.project-search { display: grid; gap: 10px; font-size: .75rem; color: var(--muted); }
.project-search input { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--page); color: var(--text); padding: 14px 16px; font: inherit; font-size: .9rem; }
.project-search input::placeholder { color: var(--muted); }
.project-search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.project-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.project-filters button { border: 1px solid var(--border); background: var(--page); color: var(--muted); padding: 8px 14px; border-radius: 30px; font-size: .75rem; transition: background .2s, transform .2s; }
.project-filters button:hover { transform: translateY(-2px); color: var(--text); }
.project-filters button[aria-pressed="true"] { color: var(--page); background: var(--accent); border-color: var(--accent); }
.results-count { color: var(--muted); font-size: .75rem; margin: 24px 0 16px; }
.empty-journal { padding: 48px 24px; text-align: center; border: 1px dashed var(--border); border-radius: 18px; }

.empty-journal p { color: var(--muted); margin-top: 16px; }

/* Motion, interactive quest sheets, and the miniature village. */
.adventure-header .nav-links a { isolation: isolate; }
.adventure-header .nav-links a.is-active { background: transparent; border-color: transparent; box-shadow: none; }
.nav-active-backdrop { position: absolute; inset: 0; z-index: -1; border-radius: 12px; background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent); }
.village-experience { min-width: 0; }
.scene-selector { display: flex; justify-content: center; gap: 5px; padding: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 30px; width: fit-content; margin: 0 auto 18px; }
.scene-selector button { background: transparent; border: 0; border-radius: 25px; color: var(--muted); padding: 9px 17px; font-size: .75rem; }
.scene-selector button[aria-pressed="true"] { background: var(--accent); color: var(--page); }
.village-3d { border-radius: 40px 40px 20px 20px; border: 1px solid var(--border); padding: 8px; background: var(--surface); box-shadow: 0 14px 35px #253f2414; overflow: hidden; }
.village-canvas { height: 350px; border-radius: 32px 32px 12px 12px; overflow: hidden; cursor: grab; touch-action: pan-y; }
.village-canvas:active { cursor: grabbing; }
.village-3d-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 15px 12px 9px; font-size: .7rem; color: var(--muted); }
.village-3d-footer a { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }

/* The forest directory: original blocky sheep, animated with CSS. */
:root {
 --sheep-wool:#e5eee1; --sheep-wool-light:#fafbed; --sheep-wool-shade:#c5d9c9;
 --sheep-thread:#a2bdad; --sheep-shadow:#366b6320;
}
:root[data-theme="dark"] { --sheep-shadow:#020d1650; }
.sheep-directory { padding-block:25px 36px; border-bottom:1px solid var(--border); }
.sheep-directory-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; }
.sheep-directory-heading .eyebrow { color:var(--rose); font-size:.55rem; letter-spacing:.15em; margin-bottom:12px; }
.sheep-directory-heading h2 { font-size:clamp(1.55rem,2.5vw,2.15rem); }

.sheep-pause { display:inline-flex; align-items:center; gap:12px; flex-shrink:0; border:1px solid var(--border); border-radius:30px; background:var(--surface); color:var(--muted); font-size:.65rem; padding:10px 14px; }
.sheep-pause:hover:not(:disabled) { border-color:var(--rose); color:var(--text); }

.sheep-directory-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; }
.sheep-destination,[data-color="mint"] { --sheep-wool:#d4ebdc; --sheep-wool-light:#edf9e8; --sheep-wool-shade:#accfbc; --sheep-thread:#8db9a2; --sheep-card-tint:var(--art); }
[data-color="rose"] { --sheep-wool:#f0cfdf; --sheep-wool-light:#ffe8ef; --sheep-wool-shade:#d6abc4; --sheep-thread:#c188a7; --sheep-card-tint:var(--rose-soft); }
[data-color="moon"] { --sheep-wool:#edead9; --sheep-wool-light:#fffced; --sheep-wool-shade:#cdd4c5; --sheep-thread:#a6b4a3; --sheep-card-tint:var(--tag); }
[data-color="lilac"] { --sheep-wool:#ddd5ee; --sheep-wool-light:#f1eafa; --sheep-wool-shade:#bdb3d5; --sheep-thread:#a094b8; --sheep-card-tint:var(--rose-soft); }
[data-color="teal"] { --sheep-wool:#9ed1c4; --sheep-wool-light:#c9ead9; --sheep-wool-shade:#76b0a4; --sheep-thread:#59988e; --sheep-card-tint:var(--art); }
.sheep-destination { position:relative; display:flex; flex-direction:column; padding:20px 15px 18px; border:1px solid var(--border); border-radius:22px; min-width:0; background:linear-gradient(155deg,var(--surface) 35%,color-mix(in srgb,var(--sheep-card-tint) 55%,var(--surface))); transition:border-color .2s,box-shadow .2s,translate .25s; isolation:isolate; }
.sheep-destination::before { content:''; position:absolute; top:45px; left:15%; width:70%; aspect-ratio:1; background:radial-gradient(ellipse,var(--sheep-card-tint),transparent 70%); z-index:-1; opacity:.8; }
.sheep-number { color:var(--muted); font-size:.55rem; letter-spacing:.12em; }

@media(prefers-reduced-motion:no-preference) {

 .sheep-directory[data-paused="false"] .sheep-destination:is(:hover,:focus-visible) .sheep-hover-stars { animation:sheep-sparkle 1.2s ease-in-out infinite; }
 @keyframes sheep-breathe { 0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)} }
 @keyframes sheep-blink { 0%,43%,47%,100%{scale:1 1}45%{scale:1 .08} }
 @keyframes sheep-ear-twitch { 0%,80%,90%,100%{rotate:0deg}83%,87%{rotate:-12deg} }

 @keyframes sheep-sparkle { 0%,100%{opacity:.3}50%{opacity:1} }

 .adventure-header .menu-toggle { display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:20px; padding:9px 12px; background:var(--surface); color:var(--text); font-size:.75rem; }
 .adventure-header .nav-links { display:none; order:4; width:100%; margin-left:0; border-top:1px solid var(--border); padding-top:12px; justify-content:center; }
 .adventure-header .nav-links.is-open { display:flex; }
}
@media(max-width:1000px) {
 .sheep-directory-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
 .sheep-destination { padding-inline:20px; }
 .interests-grid { grid-template-columns:1fr; }
 .interest-card { display:grid; grid-template-columns:100px 1fr; column-gap:18px; padding:18px; }
 .interest-art { grid-row:1/4; align-self:center; margin:0; padding:0; }
 .interest-placeholder { margin-top:0; }
}
@media(max-width:600px) {
 .sheep-directory-heading { align-items:flex-start; flex-direction:column; gap:14px; }
 .sheep-directory-heading h2 { max-width:290px; line-height:1.2; }
 .sheep-directory-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
 .sheep-destination { padding:15px 12px; }
 .sheep-destination:last-child { grid-column:1/-1; width:calc(50% - 6px); justify-self:center; }
 .sheep-destination-label { font-size:1rem; }
 .sheep-destination-note { font-size:.56rem; }
 .sheep-speech { font-size:.47rem; padding-inline:7px; }
 .sheep-directory-hint { line-height:1.7; font-size:.58rem; }
 .interest-card { grid-template-columns:80px 1fr; padding:16px; gap:0 14px; }
}
@media(prefers-reduced-motion:reduce) {
 .sheep-destination { transition:none; }
 .sheep-destination:hover,.sheep-destination:focus-visible { translate:none; }
 .sheep-speech { transition:none; }

}.sheep-directory[data-paused="true"] .sheep-destination:hover,
.sheep-directory[data-paused="true"] .sheep-destination:focus-visible { translate:none; }
/* Keep the artwork; let the words breathe. */
.hero h1 { font:400 clamp(3rem,6vw,5.4rem)/1.05 Georgia,serif; letter-spacing:-.06em; margin:0 0 22px; }
.hero h1 .name-star { font-size:.35em; margin-left:12px; }
.hero .hero-introduction { font-size:.92rem; margin-bottom:28px; }
.brand-copy { gap:0; }
.sheep-directory-heading { align-items:center; margin-bottom:18px; }
.sheep-directory-heading h2 { font-size:1.5rem; }
.sheep-pause { width:36px; height:36px; padding:0; justify-content:center; }
.sheep-destination .directory-sheep { margin-block:0 9px; }
.section-heading h2 { font-size:1.7rem; }
.section { padding-block:48px; }
.project-art .compact-forest { top:-10px; }
.project-content .tags:empty { display:none; }
.interest-card h3 { margin-top:0; margin-bottom:0; font-size:1.05rem; }
.journal-heading { padding-bottom:25px; }
.journal-heading h1 { margin-bottom:0; }
.project-search input { font-size:.82rem; }
.contact-panel .contact-links { padding-block:5px; }
.visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
@media(max-width:1000px) { .interest-card { align-items:center; } .interest-art { grid-row:auto; } }
@media(max-width:600px) { .sheep-directory-heading { flex-direction:row; align-items:center; } .hero { padding-block:42px 20px; } }
.preference-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
.preference-card { display:flex; flex-direction:column; align-items:stretch; padding:14px 22px 24px; }
.preference-card .interest-art { margin:0; padding:0; }
.preference-card h3 { margin:6px 0 10px; font-size:1.3rem; }
.preference-card p { margin:0; }
.preference-list { margin:0; padding-left:18px; color:var(--muted); font-size:.85rem; line-height:1.9; }
.preference-list li::marker { color:var(--accent); }
.preference-card[data-color="rose"] .preference-list li::marker { color:var(--rose); }
@media(max-width:500px) { .preference-grid { grid-template-columns:1fr; } }
/* Reference sheep: neutral white pixel wool and brown legs in both themes. */
.pixel-sheep { overflow:visible; }
.pixel-sheep .sheep-head { will-change:transform; }
.sheep-directory .pixel-sheep .sheep-character { transform-origin:110px 141px; }
.sheep-directory .pixel-sheep .sheep-leg-front { transform-origin:center top; }
/* Personal photos, styled as small keepsakes. */
.photo-coming-soon { color:var(--muted); font-size:.8rem; margin:0 0 20px; }
.photo-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; align-items:start; }
.photo-card { margin:0; min-width:0; padding:9px 9px 16px; background:var(--surface); border:1px solid var(--border); border-radius:5px; box-shadow:0 6px 16px #072c290b; rotate:-2deg; transition:rotate .25s,translate .25s,box-shadow .25s; }
.photo-card:nth-child(3n + 2) { rotate:2deg; margin-top:16px; }
.photo-card:nth-child(3n) { rotate:-1deg; }
.photo-card:hover,.photo-card:focus-within { rotate:0deg; translate:0 -4px; box-shadow:0 10px 25px #072c291a; }
.photo-placeholder,.photo-open { display:block; position:relative; width:100%; aspect-ratio:4/3; background:var(--art); color:var(--muted); border-radius:2px; overflow:hidden; }
.photo-card[data-category="friends"] .photo-placeholder { background:var(--rose-soft); color:var(--rose); }
.photo-card[data-category="everyday"] .photo-placeholder { background:var(--tag); color:var(--accent); }
.photo-placeholder-art { display:block; width:100%; height:100%; }
.photo-placeholder-orbit { opacity:.3; }
.photo-open { padding:0; border:0; cursor:zoom-in; }
.photo-open img { display:block; width:100%; height:100%; object-fit:cover; transition:scale .3s; }
.photo-open:hover img,.photo-open:focus-visible img { scale:1.04; }
.photo-expand { position:absolute; bottom:8px; right:8px; display:grid; place-items:center; width:25px; height:25px; border-radius:50%; background:var(--surface); color:var(--text); font-size:.8rem; }
.photo-card figcaption { padding:14px 7px 0; font:1.08rem Georgia,serif; color:var(--text); }
.photo-card figcaption span { display:block; color:var(--muted); font:.62rem 'Trebuchet MS',sans-serif; margin-top:6px; }
.photo-lightbox { position:fixed; z-index:21; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:15px; padding:45px 16px 16px; width:min(1000px,calc(100% - 32px)); max-height:92dvh; overflow-y:auto; box-shadow:0 25px 100px #07140c55; }
.photo-lightbox > img { display:block; width:100%; max-height:70dvh; object-fit:contain; }
.photo-lightbox-caption { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font:1rem Georgia,serif; margin:16px 4px 0; }
.photo-lightbox-caption span { font:.75rem 'Trebuchet MS',sans-serif; color:var(--muted); }
.photo-lightbox .quest-close { top:8px; right:10px; }
.sheep-directory-grid { grid-template-columns:repeat(6,minmax(0,1fr)); }
@media(max-width:1100px) { .sheep-directory-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media(max-width:760px) { .photo-grid { gap:14px; } }
@media(max-width:600px) {
 .sheep-directory-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .sheep-destination:last-child { grid-column:auto; width:auto; justify-self:stretch; }
 .photo-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
 .photo-card figcaption { font-size:1rem; }
 .photo-card:nth-child(3n + 2) { margin-top:8px; }
}
@media(max-width:380px) { .photo-grid { grid-template-columns:1fr; gap:22px; } .photo-card:nth-child(3n + 2) { margin-top:0; } }
@media(prefers-reduced-motion:reduce) {
 .photo-card,.photo-open img { transition:none; }
 .photo-card:hover,.photo-card:focus-within { rotate:inherit; translate:none; }
 .photo-open:hover img,.photo-open:focus-visible img { scale:1; }
